<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7069ff"/>
      <stop offset="1" stop-color="#3a31c2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.12" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f0fa"/>
    </linearGradient>
    <linearGradient id="note" gradientUnits="userSpaceOnUse" x1="660" y1="480" x2="850" y2="720">
      <stop offset="0" stop-color="#ffbf4d"/>
      <stop offset="1" stop-color="#ff7438"/>
    </linearGradient>
    <filter id="tile" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <filter id="lift" x="-25%" y="-20%" width="150%" height="145%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#160f6b" flood-opacity=".38"/>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>

  <!-- page with folded corner -->
  <g filter="url(#lift)">
    <path fill="url(#paper)" d="M262 202 H616 L712 298 V792 Q712 822 682 822 H262 Q232 822 232 792 V232 Q232 202 262 202 Z"/>
  </g>
  <path fill="#d8d5f6" d="M616 202 V280 Q616 298 634 298 H712 Z"/>

  <!-- the margin -->
  <rect x="296" y="244" width="6" height="536" rx="3" fill="#c7c3ff"/>

  <!-- text -->
  <rect x="336" y="262" width="230" height="34" rx="17" fill="#2d2b4a"/>
  <rect x="336" y="338" width="320" height="20" rx="10" fill="#d3d1e6"/>
  <rect x="336" y="382" width="280" height="20" rx="10" fill="#d3d1e6"/>

  <!-- tracked change: deletion -->
  <rect x="336" y="426" width="290" height="20" rx="10" fill="#f6bcbc"/>
  <rect x="326" y="433" width="312" height="7" rx="3.5" fill="#d84646"/>

  <!-- tracked change: insertion -->
  <rect x="322" y="464" width="346" height="50" rx="12" fill="#d3f3de"/>
  <rect x="336" y="479" width="300" height="20" rx="10" fill="#2f9e55"/>

  <rect x="336" y="540" width="300" height="20" rx="10" fill="#d3d1e6"/>
  <rect x="336" y="584" width="250" height="20" rx="10" fill="#d3d1e6"/>
  <rect x="336" y="646" width="310" height="20" rx="10" fill="#d3d1e6"/>
  <rect x="336" y="690" width="210" height="20" rx="10" fill="#d3d1e6"/>

  <!-- margin note: the agent -->
  <g filter="url(#lift)">
    <path d="M676 576 L636 486 L720 516 Z" fill="url(#note)" stroke="#fff" stroke-width="14" stroke-linejoin="round"/>
    <circle cx="768" cy="604" r="104" fill="url(#note)" stroke="#fff" stroke-width="14"/>
    <path d="M676 576 L636 486 L720 516 Z" fill="url(#note)"/>
  </g>
  <path fill="#fff" d="M768 536 Q774 598 836 604 Q774 610 768 672 Q762 610 700 604 Q762 598 768 536 Z"/>
  <path fill="#fff" opacity=".9" d="M820 538 Q822 558 842 560 Q822 562 820 582 Q818 562 798 560 Q818 558 820 538 Z"/>
</svg>
